<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>投資資産管理 | ASSET MANAGEMENT</title>
<style>
  :root{
    --navy:#0d1526;
    --navy-2:#131f36;
    --accent:#2f6bff;
    --bg:#f3f5f9;
    --card:#ffffff;
    --text:#1c2333;
    --muted:#8a92a6;
    --border:#e7eaf1;
    --green:#22c55e;
    --red:#ef4444;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP",-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--text);}
  .app{display:flex;min-height:100vh;}

  /* Sidebar */
  .sidebar{width:230px;background:var(--navy);color:#fff;flex-shrink:0;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;}
  .brand{padding:22px 20px;border-bottom:1px solid rgba(255,255,255,.08);}
  .brand .t1{font-size:16px;font-weight:700;letter-spacing:.02em;}
  .brand .t2{font-size:10px;letter-spacing:.12em;color:#7c88a6;margin-top:2px;}
  .nav{padding:10px;flex:1;}
  .nav button{
    width:100%;display:flex;align-items:center;gap:10px;
    background:transparent;border:none;color:#b7c0d6;
    padding:11px 12px;border-radius:8px;font-size:13.5px;cursor:pointer;
    text-align:left;margin-bottom:2px;transition:background .15s,color .15s;
  }
  .nav button:hover{background:rgba(255,255,255,.06);color:#fff;}
  .nav button.active{background:var(--accent);color:#fff;}
  .nav .ic{width:16px;text-align:center;font-size:14px;}
  .sidebar-foot{padding:14px 20px;font-size:10.5px;color:#5c6787;border-top:1px solid rgba(255,255,255,.08);}

  /* Main */
  .main{flex:1;padding:26px 30px;min-width:0;}
  .hero{background:linear-gradient(135deg,var(--navy),var(--navy-2));color:#fff;border-radius:14px;padding:26px 30px;text-align:center;margin-bottom:22px;}
  .hero .label{font-size:13px;color:#9aa5c2;letter-spacing:.04em;}
  .hero .amount{font-size:44px;font-weight:800;margin:8px 0 6px;letter-spacing:.01em;}
  .hero .diff{font-size:13px;font-weight:600;}
  .hero .diff.up{color:#4ade80;}
  .hero .diff.down{color:#f87171;}
  .hero .date{font-size:11.5px;color:#6b7690;margin-top:6px;}

  .links{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:22px;}
  .linkcard{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:22px;text-align:center;cursor:pointer;transition:box-shadow .15s,transform .15s;text-decoration:none;color:var(--text);display:block;}
  .linkcard:hover{box-shadow:0 6px 18px rgba(20,30,60,.08);transform:translateY(-2px);}
  .linkcard .emoji{font-size:22px;margin-bottom:6px;}
  .linkcard .name{font-weight:700;font-size:14px;}

  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:16px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;}
  .card h3{font-size:14px;margin:0 0 14px;display:flex;align-items:center;gap:6px;}
  .row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;font-size:13.5px;border-bottom:1px dashed var(--border);}
  .row:last-child{border-bottom:none;}
  .row .name{display:flex;align-items:center;gap:8px;}
  .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  .row .val{font-weight:700;}
  .row .pct{color:var(--muted);font-size:11.5px;margin-left:6px;font-weight:400;}
  .bar{height:8px;border-radius:4px;overflow:hidden;display:flex;margin-top:12px;background:var(--border);}
  .bar span{height:100%;}
  .cardsub{font-size:11px;color:var(--muted);font-weight:400;margin-left:auto;}
  .row.acc-row{display:block;padding:9px 0;}
  .row.acc-row .row-top{display:flex;justify-content:space-between;align-items:center;}
  .row-sub{font-size:10.5px;color:var(--muted);margin-top:2px;padding-left:17px;}

  .donutwrap{display:flex;flex-direction:column;align-items:center;}
  .donut-box{position:relative;width:180px;height:180px;}
  .donut-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;width:100%;}
  .donut-center .l1{font-size:11px;color:var(--muted);}
  .donut-center .l2{font-size:19px;font-weight:800;}
  .legend2{display:grid;grid-template-columns:1fr 1fr;gap:2px 14px;width:100%;margin-top:6px;font-size:11.5px;}
  .legend2 .li{display:flex;align-items:center;gap:6px;color:#4a5268;}

  .cryptogrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .cryptocard{border:1px solid var(--border);border-radius:10px;overflow:hidden;background:#fff;}
  .cryptobrand{padding:9px 14px;font-weight:800;font-size:14px;display:flex;align-items:center;gap:7px;letter-spacing:.01em;}
  .cryptobrand.gmo{background:#111318;color:#fff;}
  .cryptobrand.gmo .b1{color:#ff2d2d;font-weight:900;}
  .cryptobrand.mel{background:#fff;color:#1c2333;border-bottom:1px solid var(--border);}
  .cryptobrand .micon{width:17px;height:17px;background:linear-gradient(135deg,#ff5a7a,#ff8a9b);border-radius:5px;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:10px;font-weight:900;flex-shrink:0;}
  .cryptobody{padding:14px;text-align:center;}
  .cryptobody .ic{font-size:15px;margin-bottom:2px;}
  .cryptobody .nm{font-size:11.5px;color:#7ea3e0;margin-bottom:2px;}
  .cryptobody .amt{font-size:17px;font-weight:800;}
  .cryptobody .note{font-size:10px;color:#a8afc0;margin-top:3px;}
  .cryptosum{text-align:center;font-size:12.5px;color:var(--muted);margin-top:12px;}
  .cryptosum b{color:var(--text);}

  .sidejobgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .sidejobitem{border:1.5px solid var(--border);border-radius:10px;padding:14px 6px;text-align:center;font-size:12px;color:var(--muted);}
  .sidejobitem b{display:block;font-size:15px;color:var(--text);margin-top:4px;}
  .sidejobitem.hot{border-color:#f3a4a4;background:#fff6f6;}
  .sidejobtotal{text-align:center;margin-top:14px;font-size:12.5px;color:var(--muted);}
  .sidejobtotal b{display:block;font-size:18px;color:var(--text);}

  .masked{letter-spacing:.08em;color:var(--muted);font-size:11.5px;}

  /* Editor pages */
  .pagehead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;}
  .pagehead h2{font-size:19px;margin:0;}
  .pagehead p{font-size:12.5px;color:var(--muted);margin:4px 0 0;}
  .btn{background:var(--accent);color:#fff;border:none;padding:9px 16px;border-radius:8px;font-size:13px;cursor:pointer;font-weight:600;}
  .btn.secondary{background:#fff;color:var(--text);border:1px solid var(--border);}
  .btn.danger{background:#fff;color:var(--red);border:1px solid #f3c7c7;padding:6px 10px;font-size:12px;}
  .editlist{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:8px 20px;}
  .editrow{display:grid;grid-template-columns:28px 1.4fr 1fr 0.9fr 1fr 44px;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--border);}
  .editrow:last-child{border-bottom:none;}
  .editrow input[type=text], .editrow input[type=number]{
    border:1px solid var(--border);border-radius:7px;padding:8px 10px;font-size:13px;width:100%;font-family:inherit;
  }
  .editrow input[type=color]{width:34px;height:30px;padding:0;border:1px solid var(--border);border-radius:7px;cursor:pointer;}
  .addrow{padding:14px 0 4px;}
  .subgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px;}
  .fieldlabel{font-size:11px;color:var(--muted);margin-bottom:4px;display:block;}
  .settingsblock{margin-bottom:22px;}
  .settingsblock h3{font-size:14px;margin-bottom:10px;}
  .toggle{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);cursor:pointer;user-select:none;}
  .toggle input{transform:scale(1.1);}
  .save-msg{font-size:11.5px;color:var(--green);margin-left:10px;}
  @media(max-width:1000px){
    .grid3, .cryptogrid, .sidejobgrid, .links{grid-template-columns:1fr;}
    .app{flex-direction:column;}
    .sidebar{width:100%;height:auto;position:relative;}
  }
</style>
</head>
<body>
<div class="app">
  <div class="sidebar">
    <div class="brand">
      <div class="t1">投資資産管理</div>
      <div class="t2">ASSET MANAGEMENT</div>
    </div>
    <div class="nav" id="nav"></div>
    <div class="sidebar-foot">左メニューでデータを更新すると<br>ダッシュボードに自動反映されます</div>
  </div>
  <div class="main" id="main"></div>
</div>

<script>
/* ============ 상태(State) ============ */
const DEFAULT_STATE = {
  links: { blog:"https://hukugyoumain.blogspot.com", youtube:"", x:"" },
  prevTotal: 511554834,
  accounts: [
    {id:1, name:"楽天証券", amount:5344566, color:"#ef4444", startDate:"2023-04-01"},
    {id:2, name:"GMOコイン", amount:409641, color:"#3b82f6", startDate:"2024-11-14"},
    {id:3, name:"MOOMOO", amount:365539, color:"#f59e0b", startDate:"2024-06-01"},
    {id:4, name:"FX高金利積立", amount:199553, color:"#8b5cf6", startDate:"2024-01-15"},
    {id:5, name:"iDeCo", amount:26891, color:"#10b981", startDate:"2023-09-01"},
    {id:6, name:"メルコイン", amount:19669, color:"#ec4899", startDate:"2026-07-05"},
  ],
  portfolio: [
    {id:1, name:"中国関連", pct:41.2, color:"#ef4444"},
    {id:2, name:"ビットコイン関連", pct:40, color:"#f59e0b"},
    {id:3, name:"インデックス", pct:6.2, color:"#8b5cf6"},
    {id:4, name:"AI・量子", pct:4.2, color:"#3b82f6"},
    {id:5, name:"バイオ・医療", pct:2.1, color:"#10b981"},
    {id:6, name:"債券ETF", pct:1.7, color:"#06b6d4"},
  ],
  portfolioEval: 5380000,
  crypto: [
    {id:1, name:"ビットコイン①", amount:1224017, note:"2024.11.14〜 毎日500円", icon:"₿", color:"#f59e0b"},
    {id:2, name:"ソラナ(SOL)", amount:2188580, note:"2024.11.14〜 毎日500円", icon:"◎", color:"#8b5cf6"},
    {id:3, name:"ビットコイン②", amount:500000, note:"2026.7.5〜 毎日500円", icon:"₿", color:"#f59e0b"},
    {id:4, name:"イーサリアム", amount:45889, note:"2026.7.5〜 毎日500円", icon:"♦", color:"#3b82f6"},
  ],
  sidejobs: [
    {id:1, name:"メルカリ", amount:12000},
    {id:2, name:"FX売買", amount:50000},
    {id:3, name:"その他", amount:0},
  ],
  points: [
    {id:1, name:"PAYPAY【金投資】", amount:12000},
    {id:2, name:"楽天ポイント【ビットコイン】", amount:12500},
  ],
  banks: [
    {id:1, name:"楽天銀行", amount:0},
    {id:2, name:"Paypay銀行", amount:0},
    {id:3, name:"りそな銀行", amount:0},
  ],
  banksHidden: true,
};

let state = loadState();
let activeView = "dashboard";

function loadState(){
  try{
    const raw = localStorage.getItem("assetDashboardData");
    if(raw){
      const parsed = JSON.parse(raw);
      if(Array.isArray(parsed.accounts)){
        parsed.accounts.forEach(a=>{ if(!a.startDate) a.startDate = todayStr(); });
      }
      return parsed;
    }
  }catch(e){}
  return JSON.parse(JSON.stringify(DEFAULT_STATE));
}
function todayStr(){ return new Date().toISOString().slice(0,10); }
function elapsedDays(startDateStr){
  if(!startDateStr) return 0;
  const start = new Date(startDateStr + "T00:00:00");
  const now = new Date();
  now.setHours(0,0,0,0);
  const diff = Math.floor((now - start) / 86400000);
  return diff >= 0 ? diff + 1 : 0; // 開始日を1日目として数える
}
function saveState(){
  localStorage.setItem("assetDashboardData", JSON.stringify(state));
}
function uid(){ return Date.now() + Math.floor(Math.random()*1000); }
function yen(n){ return Number(n||0).toLocaleString("ja-JP") + "円"; }
function sum(arr, key){ return arr.reduce((a,b)=>a+(Number(b[key])||0),0); }

/* ============ 네비게이션 ============ */
const NAV_ITEMS = [
  {key:"dashboard", icon:"▦", label:"ダッシュボード"},
  {key:"accounts", icon:"🏦", label:"口座別資産"},
  {key:"portfolio", icon:"📊", label:"ポートフォリオ"},
  {key:"crypto", icon:"🪙", label:"暗号資産"},
  {key:"sidejob", icon:"💼", label:"副業・収入"},
  {key:"settings", icon:"⚙", label:"設定"},
];

function renderNav(){
  const nav = document.getElementById("nav");
  nav.innerHTML = NAV_ITEMS.map(it => `
    <button data-key="${it.key}" class="${activeView===it.key?'active':''}">
      <span class="ic">${it.icon}</span>${it.label}
    </button>`).join("");
  nav.querySelectorAll("button").forEach(b=>{
    b.addEventListener("click", ()=>{
      activeView = b.dataset.key;
      render();
    });
  });
}

/* ============ 메인 렌더러 ============ */
function render(){
  renderNav();
  const main = document.getElementById("main");
  if(activeView==="dashboard") main.innerHTML = viewDashboard();
  else if(activeView==="accounts") main.innerHTML = viewEditList("accounts","口座別資産","口座の残高を編集すると、ダッシュボードに即反映されます。");
  else if(activeView==="portfolio") main.innerHTML = viewPortfolioEdit();
  else if(activeView==="crypto") main.innerHTML = viewCryptoEdit();
  else if(activeView==="sidejob") main.innerHTML = viewSidejobEdit();
  else if(activeView==="settings") main.innerHTML = viewSettings();

  attachHandlers();
}

/* ============ 대시보드 뷰 ============ */
function viewDashboard(){
  // GMOコイン＝暗号資産の上半分の合計、メルコイン＝下半分の合計 を自動反映
  const cryptoList = state.crypto;
  const half = Math.ceil(cryptoList.length/2);
  const cryptoTopSum = sum(cryptoList.slice(0,half),"amount");
  const cryptoBottomSum = sum(cryptoList.slice(half),"amount");
  const displayAccounts = state.accounts.map(a=>{
    if(a.name==="GMOコイン") return {...a, amount: cryptoTopSum, linked:true};
    if(a.name==="メルコイン") return {...a, amount: cryptoBottomSum, linked:true};
    return a;
  });

  const accTotal = sum(displayAccounts,"amount");
  const rakutenAmount = displayAccounts.find(a=>a.name==="楽天証券")?.amount || 0;
  const total = accTotal; // 暗号資産はGMO/メルコイン経由で既に合算済みのため二重計上しない
  const diff = total - Number(state.prevTotal||0);
  const diffClass = diff>=0 ? "up":"down";
  const diffSign = diff>=0 ? "+":"";
  const today = new Date().toISOString().slice(0,10).replace(/-/g,"-");

  const accRows = displayAccounts.map(a=>`
    <div class="row acc-row">
      <div class="row-top">
        <div class="name"><span class="dot" style="background:${a.color}"></span>${a.name}</div>
        <div class="val">${yen(a.amount)} <span class="pct">${accTotal? (a.amount/accTotal*100).toFixed(1):0}%</span></div>
      </div>
      <div class="row-sub">${a.startDate ? `開始日 ${a.startDate} ・ 経過 ${elapsedDays(a.startDate)}日` : ''}</div>
    </div>`).join("");
  const accBar = displayAccounts.map(a=>`<span style="width:${accTotal? (a.amount/accTotal*100):0}%;background:${a.color}"></span>`).join("");

  const pfRows = state.portfolio.map(p=>`
    <div class="li"><span class="dot" style="background:${p.color}"></span>${p.name} ${p.pct}%</div>`).join("");

  const cryptoTotal = sum(state.crypto,"amount");
  const cryptoHalf = Math.ceil(state.crypto.length/2);
  const cryptoCards = state.crypto.map((c,i)=>{
    const isGmo = i < cryptoHalf;
    const brand = isGmo
      ? `<div class="cryptobrand gmo"><span class="b1">GMO</span>コイン</div>`
      : `<div class="cryptobrand mel"><span class="micon">m</span>mercoin</div>`;
    return `
    <div class="cryptocard">
      ${brand}
      <div class="cryptobody">
        <div class="ic" style="color:${c.color}">${c.icon}</div>
        <div class="nm">${c.name}</div>
        <div class="amt">${yen(c.amount)}</div>
        <div class="note">${c.note}</div>
      </div>
    </div>`;
  }).join("");

  const sidejobTotal = sum(state.sidejobs,"amount");
  const sidejobCards = state.sidejobs.map(s=>`
    <div class="sidejobitem ${s.amount>0?'hot':''}">${s.name}<b>${yen(s.amount)}</b></div>`).join("");

  const pointTotal = sum(state.points,"amount");
  const pointRows = state.points.map(p=>`
    <div class="row"><div class="name">${p.name}</div><div class="val">${yen(p.amount)}</div></div>`).join("");

  const bankRows = state.banks.map(b=>`
    <div class="row"><div class="name">${b.name}</div><div class="val">${state.banksHidden? '<span class="masked">※非公開</span>' : yen(b.amount)}</div></div>`).join("");

  return `
    <div class="hero">
      <div class="label">今週の投資資産サマリ</div>
      <div class="amount">${yen(total)}</div>
      <div class="diff ${diffClass}">前週比：${diffSign}${diff.toLocaleString("ja-JP")}円</div>
      <div class="date">${today}</div>
    </div>

    <div class="grid3">
      <div class="card">
        <h3>🏛 口座別資産 <span class="cardsub">本日：${today}</span></h3>
        ${accRows}
        <div class="bar">${accBar}</div>
      </div>
      <div class="card">
        <h3>✉ 楽天証券ポートフォリオ内訳</h3>
        <div class="donutwrap">
          <div class="donut-box">
            ${buildDonutSVG(state.portfolio)}
            <div class="donut-center"><div class="l1">評価額</div><div class="l2">${Math.round(rakutenAmount/10000).toLocaleString("ja-JP")}万円</div></div>
          </div>
          <div class="legend2">${pfRows}</div>
        </div>
      </div>
      <div class="card">
        <h3>🔶 暗号資産（現物）</h3>
        <div class="cryptogrid">${cryptoCards}</div>
        <div class="cryptosum">暗号資産合計：<b>${yen(cryptoTotal)}</b></div>
      </div>
    </div>

    <div class="grid3">
      <div class="card">
        <h3>🧳 副業状況（今週）</h3>
        <div class="sidejobgrid">${sidejobCards}</div>
        <div class="sidejobtotal">今週の副業収入合計<b>${yen(sidejobTotal)}</b></div>
      </div>
      <div class="card">
        <h3>◎ ポイント投資</h3>
        ${pointRows}
        <div class="sidejobtotal" style="margin-top:14px;">ポイント資産合計：<b style="font-size:14px;display:inline;">${yen(pointTotal)}</b></div>
      </div>
      <div class="card">
        <h3>🏦 銀行預金</h3>
        ${bankRows}
      </div>
    </div>

    <div class="links">
      <a class="linkcard" href="${state.links.blog||'#'}" target="_blank"><div class="emoji">📖</div><div class="name">Blog</div></a>
      <a class="linkcard" href="${state.links.youtube||'#'}" target="_blank"><div class="emoji">📺</div><div class="name">YouTube</div></a>
      <a class="linkcard" href="${state.links.x||'#'}" target="_blank"><div class="emoji">🦋</div><div class="name">X / Threads</div></a>
    </div>
  `;
}

function buildDonutSVG(portfolio){
  const size = 180, r = 66, sw = 22, cx = size/2, cy = size/2;
  const circumference = 2 * Math.PI * r;
  const total = sum(portfolio,"pct") || 1;
  let acc = 0;
  const segs = portfolio.map(p=>{
    const frac = (Number(p.pct)||0) / total;
    const dash = frac * circumference;
    const gap = circumference - dash;
    const offset = -acc;
    acc += dash;
    return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${p.color}" stroke-width="${sw}"
              stroke-dasharray="${dash.toFixed(2)} ${gap.toFixed(2)}" stroke-dashoffset="${offset.toFixed(2)}"></circle>`;
  }).join("");
  return `
    <svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#eef0f5" stroke-width="${sw}"></circle>
      <g transform="rotate(-90 ${cx} ${cy})">${segs}</g>
    </svg>`;
}

/* ============ 공통 편집 리스트 (계좌별자산) ============ */
function viewEditList(key, title, desc){
  const list = state[key];
  let cryptoTopSum = 0, cryptoBottomSum = 0;
  if(key==="accounts"){
    const half = Math.ceil(state.crypto.length/2);
    cryptoTopSum = sum(state.crypto.slice(0,half),"amount");
    cryptoBottomSum = sum(state.crypto.slice(half),"amount");
  }
  const rows = list.map(item=>{
    const isGmo = key==="accounts" && item.name==="GMOコイン";
    const isMel = key==="accounts" && item.name==="メルコイン";
    const linked = isGmo || isMel;
    const linkedVal = isGmo ? cryptoTopSum : cryptoBottomSum;
    return `
    <div class="editrow" data-id="${item.id}">
      <input type="color" class="f-color" value="${item.color}">
      <input type="text" class="f-name" value="${item.name}" placeholder="名称">
      <input type="number" class="f-amount" value="${linked ? linkedVal : item.amount}" placeholder="金額" ${linked?'disabled title="暗号資産（現物）から自動計算されます"':''}>
      ${key==="accounts" ? `<input type="date" class="f-startdate" value="${item.startDate||''}" title="投資開始日">` : '<div></div>'}
      <div style="font-size:10.5px;color:var(--muted);">${linked?'🔗 暗号資産と連動':(key==="accounts"?`経過 ${elapsedDays(item.startDate)}日`:'')}</div>
      <button class="btn danger f-del">削除</button>
    </div>`;
  }).join("");
  return `
    <div class="pagehead">
      <div><h2>${title}</h2><p>${desc}${key==="accounts"?' ※GMOコインは暗号資産の上半分、メルコインは下半分の合計が自動で入ります。':''}</p></div>
      <button class="btn" id="addItem" data-key="${key}">＋ 項目を追加</button>
    </div>
    <div class="editlist" data-key="${key}">${rows || '<div style="padding:20px;color:var(--muted);font-size:13px;">まだ項目がありません</div>'}</div>
  `;
}

/* ============ 포트폴리오 편집 뷰 ============ */
function viewPortfolioEdit(){
  const list = state.portfolio;
  const pctTotal = sum(list,"pct");
  const rakutenAmount = state.accounts.find(a=>a.name==="楽天証券")?.amount || 0;
  const rows = list.map(item=>`
    <div class="editrow" data-id="${item.id}">
      <input type="color" class="f-color" value="${item.color}">
      <input type="text" class="f-name" value="${item.name}" placeholder="名称">
      <input type="number" step="0.1" class="f-pct" value="${item.pct}" placeholder="比率%">
      <div></div><div></div>
      <button class="btn danger f-del">削除</button>
    </div>`).join("");
  return `
    <div class="pagehead">
      <div><h2>ポートフォリオ</h2><p>比率合計は100%を目安にしてください（現在 ${pctTotal.toFixed(1)}%）。</p></div>
      <button class="btn" id="addItem" data-key="portfolio">＋ 項目を追加</button>
    </div>
    <div class="editlist" data-key="portfolio">${rows}</div>
    <div class="card" style="margin-top:16px;max-width:320px;">
      <span class="fieldlabel">評価額（円） 🔗 口座別資産の「楽天証券」と連動</span>
      <input type="number" value="${rakutenAmount}" disabled title="口座別資産の楽天証券から自動計算されます" style="width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:7px;font-size:13px;background:#f6f7fa;color:var(--muted);">
    </div>
  `;
}

/* ============ 설정 뷰 ============ */
function viewSettings(){
  const bankRows = state.banks.map(item=>`
    <div class="editrow" data-id="${item.id}" data-key="banks" style="grid-template-columns:1.4fr 1fr 44px;">
      <input type="text" class="f-name" value="${item.name}" placeholder="銀行名">
      <input type="number" class="f-amount" value="${item.amount}" placeholder="残高（非公開表示可）">
      <button class="btn danger f-del">削除</button>
    </div>`).join("");
  return `
    <div class="pagehead"><div><h2>設定</h2><p>外部リンク・銀行預金・表示設定を管理します。</p></div></div>

    <div class="settingsblock">
      <h3>外部リンク</h3>
      <div class="subgrid">
        <div><span class="fieldlabel">Blog URL</span><input type="text" id="linkBlog" value="${state.links.blog}" style="width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:7px;"></div>
        <div><span class="fieldlabel">YouTube URL</span><input type="text" id="linkYoutube" value="${state.links.youtube}" style="width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:7px;"></div>
        <div><span class="fieldlabel">X / Threads URL</span><input type="text" id="linkX" value="${state.links.x}" style="width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:7px;"></div>
        <div><span class="fieldlabel">前週の総資産（前週比の計算に使用）</span><input type="number" id="prevTotal" value="${state.prevTotal}" style="width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:7px;"></div>
      </div>
    </div>

    <div class="settingsblock">
      <h3>銀行預金 <label class="toggle" style="margin-left:12px;"><input type="checkbox" id="banksHidden" ${state.banksHidden?'checked':''}> 金額を非公開にする</label></h3>
      <div class="editlist" data-key="banks">${bankRows}</div>
      <div class="addrow"><button class="btn secondary" id="addBank">＋ 銀行を追加</button></div>
    </div>

    <div class="settingsblock">
      <button class="btn secondary" id="resetData">初期データにリセット</button>
      <span class="save-msg" id="saveMsg"></span>
    </div>
  `;
}

/* ============ 이벤트 바인딩 ============ */
function attachHandlers(){
  // 공통: 이름/금액/색상/비율/메모 입력 → 상태 갱신
  document.querySelectorAll(".editrow").forEach(rowEl=>{
    const listKey = rowEl.dataset.key || rowEl.closest(".editlist")?.dataset.key;
    const id = Number(rowEl.dataset.id);
    const item = state[listKey]?.find(x=>x.id===id);
    if(!item) return;

    const bind = (sel, field, isNum)=>{
      const el = rowEl.querySelector(sel);
      if(!el) return;
      el.addEventListener("input", ()=>{
        item[field] = isNum ? Number(el.value) : el.value;
        saveState();
      });
    };
    bind(".f-name","name",false);
    bind(".f-amount","amount",true);
    bind(".f-pct","pct",true);
    bind(".f-color","color",false);
    bind(".f-note","note",false);
    bind(".f-startdate","startDate",false);
    const startDateEl = rowEl.querySelector(".f-startdate");
    if(startDateEl) startDateEl.addEventListener("change", ()=> render());

    const delBtn = rowEl.querySelector(".f-del");
    if(delBtn) delBtn.addEventListener("click", ()=>{
      state[listKey] = state[listKey].filter(x=>x.id!==id);
      saveState();
      render();
    });
  });

  // 항목 추가 버튼들
  const addItemBtn = document.getElementById("addItem");
  if(addItemBtn) addItemBtn.addEventListener("click", ()=>{
    const key = addItemBtn.dataset.key;
    const palette = ["#ef4444","#3b82f6","#f59e0b","#8b5cf6","#10b981","#ec4899","#06b6d4"];
    const color = palette[state[key].length % palette.length];
    if(key==="portfolio") state[key].push({id:uid(), name:"新規項目", pct:0, color});
    else if(key==="crypto") state[key].push({id:uid(), name:"新規銘柄", amount:0, note:"", icon:"◆", color});
    else if(key==="accounts") state[key].push({id:uid(), name:"新規項目", amount:0, color, startDate: todayStr()});
    else state[key].push({id:uid(), name:"新規項目", amount:0, color});
    saveState(); render();
  });
  const addSidejob = document.getElementById("addSidejob");
  if(addSidejob) addSidejob.addEventListener("click", ()=>{
    state.sidejobs.push({id:uid(), name:"新規項目", amount:0}); saveState(); render();
  });
  const addPoint = document.getElementById("addPoint");
  if(addPoint) addPoint.addEventListener("click", ()=>{
    state.points.push({id:uid(), name:"新規項目", amount:0}); saveState(); render();
  });
  const addBank = document.getElementById("addBank");
  if(addBank) addBank.addEventListener("click", ()=>{
    state.banks.push({id:uid(), name:"新規銀行", amount:0}); saveState(); render();
  });

  // 포트폴리오 評価額は口座別資産（楽天証券）と自動連動のため編集不可

  // 설정: 링크 / 전주 총자산 / 은행 비공개 토글
  const map = { linkBlog:["links","blog"], linkYoutube:["links","youtube"], linkX:["links","x"] };
  Object.keys(map).forEach(id=>{
    const el = document.getElementById(id);
    if(!el) return;
    el.addEventListener("input", ()=>{
      state[map[id][0]][map[id][1]] = el.value; saveState(); flashSaved();
    });
  });
  const prevTotalEl = document.getElementById("prevTotal");
  if(prevTotalEl) prevTotalEl.addEventListener("input", ()=>{ state.prevTotal = Number(prevTotalEl.value); saveState(); flashSaved(); });

  const banksHiddenEl = document.getElementById("banksHidden");
  if(banksHiddenEl) banksHiddenEl.addEventListener("change", ()=>{ state.banksHidden = banksHiddenEl.checked; saveState(); flashSaved(); });

  const resetBtn = document.getElementById("resetData");
  if(resetBtn) resetBtn.addEventListener("click", ()=>{
    if(confirm("すべてのデータを初期値に戻します。よろしいですか？")){
      state = JSON.parse(JSON.stringify(DEFAULT_STATE));
      saveState(); render();
    }
  });
}
function flashSaved(){
  const el = document.getElementById("saveMsg");
  if(!el) return;
  el.textContent = "✓ 保存しました";
  setTimeout(()=>{ if(el) el.textContent=""; }, 1500);
}

render();
</script>

</html>
